
name: CI-format-check

on:
  push:
    paths:
      - '**.h'
      - '**.c'
      - '.github/workflows/check-format.yml'
      - '.clang-format'
  pull_request:
    paths:
      - '**.h'
      - '**.c'
      - '.github/workflows/check-format.yml'
      - '.clang-format'

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: DoozyX/clang-format-lint-action@v0.18.2
      with:
        source: '.'
        extensions: 'h,c'
        clangFormatVersion: 12
        inplace: False
        exclude: './modules/isofs/chd ./modules/isofs/chd.c ./modules/isofs/chd.h ./modules/isofs/chd_bitstream.c ./modules/isofs/chd_bitstream.h ./modules/isofs/chd_huffman.c ./modules/isofs/chd_huffman.h ./modules/isofs/chdconfig.h ./src/chd.c ./tests/chd_reader_test.c'
